name: Production performance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'package.json', 'pnpm-lock.yaml', 'vite.config.ts', 'vercel.json', '.github/workflows/performance.yml']
permissions:
  contents: read
  statuses: read
concurrency:
  group: production-performance
  cancel-in-progress: true
jobs:
  lighthouse:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for this commit's Vercel deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "pending"')
            if [ "$state" = success ]; then exit 0; fi
            if [ "$state" = failure ] || [ "$state" = error ]; then
              echo "Vercel deployment failed for $GITHUB_SHA"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for Vercel deployment of $GITHUB_SHA"
          exit 1
      - name: Measure deployed guest workspace
        run: |
          for sample in 1 2 3; do
            corepack pnpm dlx lighthouse@13.5.0 https://kimpor-workspace.vercel.app --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,best-practices --output=json --output-path="lighthouse-mobile-$sample.json" --quiet
          done
          corepack pnpm dlx lighthouse@13.5.0 https://kimpor-workspace.vercel.app --preset=desktop --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,best-practices --output=json --output-path=lighthouse-desktop.json --quiet
      - name: Check release targets
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const median = values => values.sort((a, b) => a - b)[Math.floor(values.length / 2)];
          assert.equal(median([100, 3, 20]), 20);
          for (const device of ['mobile', 'desktop']) {
            const files = device === 'mobile' ? [1, 2, 3].map(sample => `lighthouse-mobile-${sample}.json`) : ['lighthouse-desktop.json'];
            const reports = files.map(file => JSON.parse(readFileSync(file, 'utf8')));
            for (const report of reports) {
              assert(!report.runtimeError, 'Lighthouse runtime error');
              assert(report.categories.accessibility.score === 1, `${device} accessibility below 100`);
              console.log(JSON.stringify({device, performance: report.categories.performance.score, lcp: report.audits['largest-contentful-paint'].numericValue}));
            }
            const scores = Object.fromEntries(Object.keys(reports[0].categories).map(key => [key, median(reports.map(report => report.categories[key].score))]));
            const lcp = median(reports.map(report => report.audits['largest-contentful-paint'].numericValue));
            console.log(JSON.stringify({device, scores, lcp}));
            assert(scores.performance >= .95, `${device} performance below 95`);
            assert(scores.accessibility === 1, `${device} accessibility below 100`);
            assert(lcp < 2000, `${device} LCP exceeds 2 seconds`);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-lighthouse
          path: lighthouse-*.json
